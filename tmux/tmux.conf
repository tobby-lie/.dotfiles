set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-kitty:RGB"

# Everforest dark medium
set -g status-style "bg=#343f44 fg=#d3c6aa"
set -g status-left "#[bg=#a7c080,fg=#2d353b,bold] #S #[bg=#343f44] "
set -g status-left-length 30
set -g window-status-separator ""
set -g window-status-style "bg=#343f44 fg=#859289"
set -g window-status-format " #I #W "
set -g window-status-current-style "bg=#475258 fg=#dbbc7f bold"
set -g window-status-current-format " #I #W "
set -g window-status-activity-style "bg=#343f44 fg=#e69875"
set -g window-status-bell-style "bg=#343f44 fg=#e67e80"
set -g message-style "bg=#3d484d fg=#d3c6aa"
set -g message-command-style "bg=#3d484d fg=#83c092"
set -g mode-style "bg=#4a555b fg=#d3c6aa"
set -g copy-mode-match-style "bg=#4d4c43 fg=#dbbc7f"
set -g copy-mode-current-match-style "bg=#e69875 fg=#2d353b"
set -g popup-border-style "fg=#a7c080"
set -g popup-border-lines rounded
set -g display-panes-colour "#859289"
set -g display-panes-active-colour "#a7c080"
set -g clock-mode-colour "#a7c080"

# set pane border colors
set -g pane-border-style "fg=#475258"
set -g pane-active-border-style "fg=#a7c080"

set-option -g status-right ""

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.config/tmux/tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

# lazygit in a popup, scoped to the current pane's repo
bind g display-popup -E -d "#{pane_current_path}" -w 90% -h 90% lazygit

set -g mouse on

# Route tmux copy buffer to the terminal via OSC 52 -- terminal writes it
# to the system clipboard (macOS: iTerm2, Terminal.app, Ghostty; Linux: most modern emulators).
set -g set-clipboard on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'r' send -X rectangle-toggle

# Platform-conditional clipboard pipe: pbcopy on macOS, xclip on Linux
if-shell "uname | grep -q Darwin" \
  "bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'pbcopy'" \
  "bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'xclip -selection clipboard'"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
# set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

# This was actually starting to annoy me
# set -g @resurrect-capture-pane-contents 'on'
# set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
